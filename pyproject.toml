[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forgedeps"
version = "0.4.6"
description = "Project-agnostic dependency pipeline: resolve, fetch, patch, build and install C/C++ dependencies"
requires-python = ">=3.14"
license = { file = "LICENSE" }

[project.optional-dependencies]
test = []

[project.scripts]
forgedeps = "forgedeps.__main__:main"

[tool.setuptools.package-data]
forgedeps = ["cmake/*.cmake"]

[tool.setuptools.packages.find]
where = ["."]
include = ["forgedeps*"]
