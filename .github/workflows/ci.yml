name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install distribution
        run: python -m pip install .
      - name: Check installed package outside the source import path
        run: python -I -c "import forgedeps; from pathlib import Path; from importlib.metadata import version; assert version('forgedeps') == '0.4.0'; assert (Path(forgedeps.__file__).parent / 'cmake/ForgeDeps.cmake').is_file()"
      - name: Check installed command
        run: forgedeps --version
      - name: Resolve, fetch, build, verify and rollback contracts
        run: python -m unittest discover -s tests -t tests -p "test_*.py"
