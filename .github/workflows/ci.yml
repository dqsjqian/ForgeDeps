name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CI scripts print UTF-8 diagnostics; a Windows console defaults
  # to cp1252 and raises UnicodeEncodeError on them.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHON_VERSION: '3.14'

jobs:
  tests:
    name: Offline contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, xcode-27, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v7
      # Project policy: only the latest stable CPython is supported and tested.
      # Raising this pin is a deliberate change, not a matrix expansion.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install distribution
        run: python -m pip install .
      - name: Check installed package outside the source import path
        run: python -I -c "import forgedeps; from pathlib import Path; from importlib.metadata import version; assert version('forgedeps') == '0.4.9'; assert (Path(forgedeps.__file__).parent / 'cmake/ForgeDeps.cmake').is_file()"
      - name: Check installed command
        run: forgedeps --version
      - name: Resolve, fetch, build, verify and rollback contracts
        run: python -m unittest discover -s tests -t tests -p "test_*.py"
